name: CI

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      native-matrix:
        type: string
        default: '{"include":[{"os":"macos-15","platform":"darwin-arm64"},{"os":"macos-15-intel","platform":"darwin-amd64"},{"os":"windows-2022","platform":"windows-amd64"}]}'
    secrets:
      MYGO_UPDATER_PRIVATE_KEY:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_CERTIFICATE_P12_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_IME_PROVISIONING_PROFILE_BASE64:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - run: pnpm check
      - run: pnpm workflows:check
      - run: pnpm test
      - run: pnpm updater:check
      - name: Marketing site (dictionaries, types, lint, tests, static export)
        run: pnpm site:check

  native-shell:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.native-matrix || '{"include":[{"os":"macos-15","platform":"darwin-arm64"},{"os":"macos-15-intel","platform":"darwin-amd64"},{"os":"windows-2022","platform":"windows-amd64"}]}') }}
    runs-on: ${{ matrix.os }}
    env:
      # Speech runtimes (sherpa-onnx, miniaudio) are cgo libraries.
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/desktop/go.sum
      - name: Put the speech runtime DLLs on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/desktop
        run: |
          go mod download github.com/k2-fsa/sherpa-onnx-go-windows
          dir=$(go list -m -f '{{.Dir}}' github.com/k2-fsa/sherpa-onnx-go-windows)
          cygpath -w "$dir/lib/x86_64-pc-windows-gnu" >> "$GITHUB_PATH"
      - run: pnpm desktop:check
      - run: pnpm e2e:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-content-${{ matrix.os }}
          path: .workspace/e2e/
          if-no-files-found: ignore
      - name: Provision IME signing profile
        if: inputs.release && runner.os == 'macOS'
        env:
          MACOS_IME_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_IME_PROVISIONING_PROFILE_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          const value = process.env.MACOS_IME_PROVISIONING_PROFILE_BASE64?.trim();
          if (!value) throw new Error('Missing IME provisioning profile');
          const bytes = Buffer.from(value, 'base64');
          if (!bytes.length || bytes.toString('base64') !== value) throw new Error('Invalid IME provisioning profile encoding');
          const file = path.join(process.env.RUNNER_TEMP, 'ArionInput.provisionprofile');
          writeFileSync(file, bytes, { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `MACOS_IME_PROVISIONING_PROFILE=${file}\n`);
          NODE
      - name: Build and verify desktop package
        env:
          ARION_OFFICIAL_RELEASE: ${{ inputs.release && '1' || '' }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ inputs.release && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
          MACOS_SIGNING_IDENTITY: ${{ inputs.release && runner.os == 'macOS' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ inputs.release && runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ inputs.release && runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.release && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ inputs.release && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.release && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: node scripts/build.mjs desktop
      - name: Remove IME signing profile
        if: always() && inputs.release && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/ArionInput.provisionprofile"
      - name: Collect installers and verify signed updates for releases
        run: node scripts/release.mjs collect ${{ matrix.platform }} .workspace/release/${{ matrix.platform }} ${{ inputs.release && '--signed' || '--unsigned' }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: .workspace/release/${{ matrix.platform }}/
          if-no-files-found: error
          compression-level: 0
