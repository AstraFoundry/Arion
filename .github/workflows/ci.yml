name: CI

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      MYGO_UPDATER_PRIVATE_KEY:
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - run: pnpm check
      - run: pnpm workflows:check
      - run: pnpm test
      - name: Marketing site (dictionaries, types, lint, tests, static export)
        run: pnpm site:check

  native-shell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-amd64 }
          - { os: windows-2022, platform: windows-amd64 }
    runs-on: ${{ matrix.os }}
    env:
      # Speech runtimes (sherpa-onnx, miniaudio) are cgo libraries.
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/desktop/go.sum
      - name: Put the speech runtime DLLs on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/desktop
        run: |
          go mod download github.com/k2-fsa/sherpa-onnx-go-windows
          dir=$(go list -m -f '{{.Dir}}' github.com/k2-fsa/sherpa-onnx-go-windows)
          cygpath -w "$dir/lib/x86_64-pc-windows-gnu" >> "$GITHUB_PATH"
      - run: pnpm desktop:check
      - run: pnpm e2e:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-content-${{ matrix.os }}
          path: .workspace/e2e/
          if-no-files-found: ignore
      - name: Build and verify desktop package
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ inputs.release && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: node scripts/desktop-command.mjs build
      - name: Collect installers and verify signed updates for releases
        run: node scripts/release.mjs collect ${{ matrix.platform }} .workspace/release/${{ matrix.platform }} ${{ inputs.release && '--signed' || '--unsigned' }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: .workspace/release/${{ matrix.platform }}/
          if-no-files-found: error
          compression-level: 0
