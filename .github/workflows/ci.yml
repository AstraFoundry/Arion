name: CI

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      skip-e2e:
        description: Skip previously completed native window and updater E2E checks
        type: boolean
        default: false
      native-matrix:
        type: string
        default: '{"include":[{"os":"macos-26","platform":"darwin-arm64"},{"os":"windows-2022","platform":"windows-amd64"}]}'
    secrets:
      MYGO_UPDATER_PRIVATE_KEY:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_CERTIFICATE_P12_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_IME_PROVISIONING_PROFILE_BASE64:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded pull requests cancel. Main, tags, and signed macOS dispatch do not.
# release.yml and signed-macos.yml keep their own groups with cancel-in-progress false.
# github.workflow is the caller name, so this group does not collide with those.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same patched toolchain as the native job and go.work. Module go lines stay lower; this SDK still enforces them.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: pnpm check
      - run: pnpm workflows:check
      - run: pnpm test
      - run: pnpm updater:check
      - run: pnpm notifications:check
      - name: Marketing site (dictionaries, types, lint, tests, static export)
        run: pnpm site:check
        env:
          # Blog author profiles are read from the GitHub API at build time.
          GITHUB_TOKEN: ${{ github.token }}

  # Docs-only pull requests skip Mac and Windows. Main and release skip this job and still run native.
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.decision.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Decide whether the native shell is required
        id: decision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-native-scope.mjs

  native-shell:
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.result == 'success' || needs.scope.result == 'skipped') &&
      (github.event_name != 'pull_request' || needs.scope.outputs.native == 'true')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.native-matrix || '{"include":[{"os":"macos-26","platform":"darwin-arm64"},{"os":"windows-2022","platform":"windows-amd64"}]}') }}
    runs-on: ${{ matrix.os }}
    env:
      # Native audio capture and MyGo require cgo.
      CGO_ENABLED: '1'
      XDG_CACHE_HOME: ${{ github.workspace }}/.workspace/native-download-cache
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep this pin identical to the portable job.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/desktop/go.sum
      - name: Require native MLX toolchain
        if: matrix.platform == 'darwin-arm64'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version
          swift --version
          swift -e 'import Foundation; print("Native MLX toolchain")'
      - name: Identify native build caches
        id: cache-keys
        run: node scripts/native-ci-cache-key.mjs
      - name: Restore native dependency builds
        uses: actions/cache@v4
        with:
          key: ${{ steps.cache-keys.outputs.native }}
          restore-keys: ${{ steps.cache-keys.outputs.native-restore }}
          path: |
            .workspace/native-asr-migration/
            .workspace/local-rewrite/
            .workspace/keyboard-runtime/
            .workspace/windows-compile-cache/
            .workspace/native-download-cache/
      - name: Restore standard-user Go cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          key: ${{ steps.cache-keys.outputs.go }}
          restore-keys: ${{ steps.cache-keys.outputs.go-restore }}
          path: .workspace/ci-standard-user-go-cache/
      - name: Desktop checks (macOS)
        if: runner.os == 'macOS'
        run: pnpm desktop:check
      - name: Windows updater regression checks
        if: runner.os == 'Windows'
        run: pnpm updater:check
      - name: Native window tests (macOS)
        if: runner.os == 'macOS' && !inputs.skip-e2e
        run: pnpm e2e:native
      - name: Windows platform tests
        if: runner.os == 'Windows'
        run: |
          go test -v ./apps/desktop/infrastructure/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows desktop, shared Pinyin and native module checks
        if: runner.os == 'Windows'
        run: ./scripts/check-windows-keyboard-ci.ps1
      - name: Native window tests (Windows)
        if: runner.os == 'Windows' && !inputs.skip-e2e
        run: pnpm e2e:native
      - name: Retain native keyboard evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-evidence-${{ matrix.os }}
          path: |
            ${{ runner.os == 'Windows' && '.workspace/keyboard-evidence.zip' || '.workspace/tests/' }}
            ${{ runner.temp }}/keyboard-standard-user.stdout.log
            ${{ runner.temp }}/keyboard-standard-user.stderr.log
          if-no-files-found: ignore
      - name: Isolated native updater lifecycle
        if: runner.os == 'macOS' && !inputs.skip-e2e
        run: pnpm updater:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-content-${{ matrix.os }}
          path: .workspace/e2e/
          if-no-files-found: ignore
      - name: Provision IME signing profile
        if: inputs.release && runner.os == 'macOS'
        env:
          MACOS_IME_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_IME_PROVISIONING_PROFILE_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          const value = process.env.MACOS_IME_PROVISIONING_PROFILE_BASE64?.trim();
          if (!value) throw new Error('Missing IME provisioning profile');
          const bytes = Buffer.from(value, 'base64');
          if (!bytes.length || bytes.toString('base64') !== value) throw new Error('Invalid IME provisioning profile encoding');
          const file = path.join(process.env.RUNNER_TEMP, 'ArionInput.provisionprofile');
          writeFileSync(file, bytes, { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `MACOS_IME_PROVISIONING_PROFILE=${file}\n`);
          NODE
      # Installers are for main and release. Pull requests stop after the checks above.
      - name: Build and verify desktop package
        if: github.event_name != 'pull_request' || inputs.release
        env:
          ARION_OFFICIAL_RELEASE: ${{ inputs.release && '1' || '' }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ inputs.release && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
          MACOS_SIGNING_IDENTITY: ${{ inputs.release && runner.os == 'macOS' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ inputs.release && runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ inputs.release && runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.release && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ inputs.release && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.release && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: node scripts/build.mjs desktop
      - name: Remove IME signing profile
        if: always() && inputs.release && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/ArionInput.provisionprofile"
      - name: Collect installers and verify signed updates for releases
        if: github.event_name != 'pull_request' || inputs.release
        run: node scripts/release.mjs collect ${{ matrix.platform }} .workspace/release/${{ matrix.platform }} ${{ inputs.release && '--signed' || '--unsigned' }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || inputs.release
        with:
          name: desktop-${{ matrix.platform }}
          path: .workspace/release/${{ matrix.platform }}/
          if-no-files-found: error
          compression-level: 0

  # Start native with portable. Cancel the run only after portable has already failed.
  # Release callers grant contents: read, so this request is denied there and native finishes.
  cancel-on-portable-failure:
    needs: portable
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel Mac and Windows jobs after portable failure
        continue-on-error: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run cancel "$GITHUB_RUN_ID"
