<!doctype html>
<!--
  Source of the post's figures. Open figures.html?fig=<id>&lang=<en|zh|ja>,
  screenshot the .frame element at device scale 2 and save it as
  <id>.<lang>.webp next to this file. Every number comes from a benchmark
  report linked in the post's footnotes.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
  :root {
    --frame: hsl(38 22% 92%);
    --card: hsl(40 30% 98.5%);
    --line: hsl(36 16% 85%);
    --track: hsl(36 18% 88%);
    --ink: hsl(22 14% 9%);
    --ink-2: hsl(26 10% 24%);
    --muted: hsl(30 6% 44%);
    --faint: hsl(32 8% 60%);
    --base: hsl(32 8% 62%);
    --good: hsl(150 62% 32%);
    --bad: hsl(10 72% 50%);
    --you: hsl(214 58% 44%);
    --mark: hsl(48 100% 80%);
    --mark-bad: hsl(10 85% 90%);
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: #fff; }
  body {
    width: 896px;
    padding: 0;
    font-family: "IBM Plex Sans", "PingFang SC", "Hiragino Sans", sans-serif;
    color: var(--ink-2);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  html:lang(ja) body { font-family: "IBM Plex Sans", "Hiragino Sans", "PingFang SC", sans-serif; }
  .frame { background: var(--frame); padding: 16px; border-radius: 18px; }
  .card { background: var(--card); border-radius: 12px; padding: 28px 32px; }
  .card + .card { margin-top: 12px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .zh { font-family: "PingFang SC", sans-serif; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  mark.bad { background: var(--mark-bad); }

  /* Legend */
  .legend { display: flex; gap: 20px; align-items: center; font-size: 14px; font-weight: 500; color: var(--muted); }
  .legend .key { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

  /* Dumbbell chart */
  .db { display: grid; grid-template-columns: 210px 1fr 64px; column-gap: 20px; }
  .db .head { display: contents; }
  .db .group { grid-column: 1 / -1; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; padding: 14px 0 2px; }
  .db .label { text-align: right; font-weight: 500; color: var(--ink-2); align-self: center; padding: 9px 0; }
  .db .plot { position: relative; height: 40px; }
  .db .diff { align-self: center; text-align: right; font-weight: 600; color: var(--ink); }
  .grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .bar { position: absolute; top: 50%; height: 6px; margin-top: -3px; background: var(--track); border-radius: 3px; }
  .pt { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; }
  .pt-label { position: absolute; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .axis { position: relative; height: 22px; font-size: 13px; color: var(--muted); }
  .axis span { position: absolute; transform: translateX(-50%); }
  .axis-title { text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 6px; }

  /* Quote rows */
  .quote { border-left: 3px solid var(--line); padding: 2px 0 2px 16px; }
  .quote + .quote { margin-top: 18px; }
  .quote .who { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .quote .text { font-size: 19px; color: var(--ink); }
  .quote .gloss { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .screen { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
  .screen .bar-top { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .screen .bar-top i { width: 9px; height: 9px; border-radius: 50%; background: var(--track); display: inline-block; }
  .screen .body { padding: 14px; }
  .bubble { display: inline-block; background: var(--frame); border-radius: 10px; padding: 8px 12px; font-size: 16px; color: var(--ink); }
  .sender { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .kicker { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }

  /* Diverging bars */
  .dv { display: grid; grid-template-columns: 250px 1.5fr 1fr 120px; column-gap: 0; align-items: center; }
  .dv .label { white-space: nowrap; text-align: right; padding-right: 18px; font-weight: 500; color: var(--ink-2); }
  .dv .cell { position: relative; height: 34px; }
  .dv .neg { border-right: 1px solid var(--ink-2); }
  .dv .neg .b { position: absolute; right: 0; top: 9px; height: 16px; background: var(--bad); border-radius: 3px 0 0 3px; }
  .dv .pos .b { position: absolute; left: 0; top: 9px; height: 16px; background: var(--good); border-radius: 0 3px 3px 0; }
  .dv .v { position: absolute; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 600; }
  .dv .broken { text-align: right; font-weight: 600; color: var(--ink); }
  .dv .group { grid-column: 1 / -1; font-size: 13px; font-weight: 600; color: var(--muted); padding: 12px 0 2px 0; }
  .dv .colhead { font-size: 13px; font-weight: 500; color: var(--muted); padding-bottom: 6px; }

  /* Timeline */
  .tl { display: grid; grid-template-columns: 150px 1fr; column-gap: 16px; row-gap: 10px; align-items: center; }
  .tl .label { text-align: right; font-weight: 500; }
  .track { position: relative; height: 36px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .sleep { background: repeating-linear-gradient(135deg, transparent 0 7px, hsl(36 14% 82%) 7px 8px); color: var(--muted); }
  .cpu { background: var(--bad); padding: 0; }
  .gen { background: hsl(214 45% 86%); color: hsl(214 45% 30%); }
  .measure { position: relative; height: 44px; }
  .bracket { position: absolute; top: 6px; height: 12px; border: 2px solid; border-top: none; border-radius: 0 0 4px 4px; }
  .measure .cap { position: absolute; top: 24px; font-size: 14px; white-space: nowrap; }
  .measure .cap b { font-size: 17px; }

  /* Bytes */
  .reply { font-size: 22px; color: var(--ink); letter-spacing: 0.04em; }
  .bytes { display: flex; gap: 12px; flex-wrap: wrap; }
  .ch { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 8px 10px 10px; text-align: center; }
  .ch .g { font-size: 22px; color: var(--ink); }
  .ch .bs { display: flex; gap: 4px; margin-top: 6px; }
  .ch .bs span { font-family: "IBM Plex Mono", monospace; font-size: 14px; padding: 2px 5px; border-radius: 4px; background: var(--frame); }
  .ch .bs span.hit { background: var(--bad); color: #fff; }
  .ch.sep { border-style: dashed; }
  .arrow { align-self: center; color: var(--faint); font-size: 20px; }
  .steps { display: grid; grid-template-columns: 22px 1fr; row-gap: 10px; column-gap: 10px; font-size: 15px; }
  .steps .n { width: 22px; height: 22px; border-radius: 50%; background: var(--ink-2); color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .outcome { display: flex; gap: 28px; margin-top: 4px; }
  .outcome .o { font-size: 13px; color: var(--muted); font-weight: 500; }
  .outcome .o div { font-size: 22px; color: var(--ink); font-weight: 400; }
</style>
</head>

const h = (html) => { document.getElementById("root").innerHTML = html; };
const pct = (v, max) => `${(v / max) * 100}%`;

function contextAblation() {
  const c = COPY.ctx;
  const BASE = "var(--base)", WITH = "var(--good)", MAX = 30;
  const rows = [
    { group: c.g4b },
    { label: c.cursor, a: 9, b: 9 },
    { label: c.history, a: 9, b: 10 },
    { label: c.fast, a: 9, b: 13 },
    { label: c.accurate, a: 9, b: 14 },
    { label: c.all, a: 9, b: 16 },
    { group: c.g17 },
    { label: c.all, a: 8, b: 9 },
  ];
  const grid = [0, 10, 20, 30].map((v) => `<div class="grid-line" style="left:${pct(v, MAX)}"></div>`).join("");
  const body = rows.map((r) => {
    if (r.group) return `<div class="group">${r.group}</div>`;
    const lo = Math.min(r.a, r.b), hi = Math.max(r.a, r.b);
    const same = r.a === r.b;
    return `<div class="label">${r.label}</div>
      <div class="plot">${grid}
        <div class="bar" style="left:${pct(lo, MAX)};width:calc(${pct(hi - lo, MAX)})"></div>
        <span class="pt-label num" style="right:calc(${pct(MAX - r.a, MAX)} + 16px);color:var(--muted)">${same ? "" : r.a}</span>
        <div class="pt" style="left:${pct(r.a, MAX)};background:${BASE}"></div>
        <div class="pt" style="left:${pct(r.b, MAX)};background:${WITH};${same ? "box-shadow:0 0 0 3px var(--card), 0 0 0 5px " + "var(--base)" : ""}"></div>
        <span class="pt-label num" style="left:calc(${pct(r.b, MAX)} + 16px);color:var(--good)">${r.b}</span>
      </div>
      <div class="diff num">${r.b - r.a > 0 ? "+" : "±"}${r.b - r.a}</div>`;
  }).join("");
  h(`<div class="frame"><div class="card">
    <div class="db">
      <div></div>
      <div class="legend" style="justify-content:center">
        <span class="key"><span class="dot" style="background:var(--base)"></span>${c.none}</span>
        <span class="key"><span class="dot" style="background:var(--good)"></span>${c.with}</span>
      </div>
      <div class="legend" style="justify-content:flex-end">${c.diff}</div>
      ${body}
      <div></div>
      <div class="axis num">${[0, 10, 20, 30].map((v) => `<span style="left:${pct(v, MAX)}">${v}</span>`).join("")}</div>
      <div></div>
      <div></div><div class="axis-title">${c.axis}</div><div></div>
    </div>
  </div></div>`);
}

            ${c.bubbleGloss ? `<div class="gloss muted" style="font-size:12px;margin-top:6px">${c.bubbleGloss}</div>` : ""}

        </div>
      </div>
      <div>

        <div class="quote" style="border-color:var(--bad)">

          <div class="text zh"><mark class="bad">张巍</mark><mark>周报我发群里了</mark>。</div>${gloss(c.badGloss)}

        <div class="quote" style="border-color:var(--good)">
          <div class="who" style="color:var(--good)">${c.fixed}</div>
          <div class="text zh">张伟上周请假了，下周回来。</div>
        </div>
      </div>
    </div>

}

function phonetic() {
  const c = COPY.ph;
  const MAX = 185;
  const rows = [
    { group: c.control },
    { label: c.acoustic, w: 7, i: 60, br: 0 },
    { group: c.llm },
    { label: c.text, w: 2, i: 1, br: 1 },
    { label: c.pinyin, w: 2, i: 0, br: 1 },
    { label: c.scores, w: 46, i: 1, br: 26 },
    { label: c.pscores, w: 48, i: 0, br: 23 },
    { label: c.ipa, w: 14, i: 1, br: 5 },
    { label: c.ipaOnly, w: 153, i: 0, br: 59 },
  ];
  const body = rows.map((r) => {
    if (r.group) return `<div class="group">${r.group}</div>`;
    return `<div class="label">${r.label}</div>
      <div class="cell neg">
        <div class="b" style="width:${pct(r.w, MAX)}"></div>
        <span class="v num" style="right:calc(${pct(r.w, MAX)} + 8px);color:var(--bad)">${r.w}</span>
      </div>
      <div class="cell pos">
        <div class="b" style="width:${pct(r.i, MAX)}"></div>
        <span class="v num" style="left:calc(${pct(r.i, MAX)} + 8px);color:var(--good)">${r.i}</span>
      </div>
      <div class="broken num" style="color:${r.br ? "var(--bad)" : "var(--ink)"}">${r.br} <span class="muted" style="font-weight:400;font-size:13px">${c.of}</span></div>`;
  }).join("");
  h(`<div class="frame"><div class="card">
    <div class="dv">
      <div></div>
      <div class="colhead" style="text-align:right;padding-right:10px;color:var(--bad)">← ${c.worse}</div>
      <div class="colhead" style="padding-left:10px;color:var(--good)">${c.better} →</div>
      <div class="colhead" style="text-align:right">${c.broken}</div>
      ${body}
    </div>
  </div></div>`);
}

function clock() {
  const c = COPY.clock;
  h(`<div class="frame"><div class="card">
    <div class="tl">
      <div class="label">${c.rime}</div>
      <div class="track">
        <div class="seg cpu" style="left:0;width:4px"></div>
        <div class="seg sleep" style="left:4px;right:4px;padding-left:18px">${c.sleep}</div>
        <div class="seg cpu" style="right:0;width:4px"></div>
      </div>
      <div class="label">${c.server}</div>
      <div class="track" style="background:transparent">
        <div class="seg gen" style="left:10px;right:10px;border-radius:6px">${c.gen}</div>
      </div>
      <div></div>
      <div>
        <div class="measure">
          <div class="cap" style="left:0;top:6px;color:var(--bad)"><b class="num">${c.cpuVal}</b>&nbsp; ${c.cpu} · ${c.p50}</div>
        </div>
        <div class="measure" style="height:48px">
          <div class="bracket" style="left:0;right:0;border-color:var(--ink-2)"></div>
          <div class="cap" style="left:0;color:var(--ink)"><b class="num">${c.wallVal}</b>&nbsp; ${c.wall} · ${c.p50}</div>
        </div>
      </div>
    </div>
  </div></div>`);
}

function bytes() {
  const c = COPY.bytes;
  const ch = (g, bs, cls = "") => `<div class="ch ${cls}"><div class="g">${g}</div><div class="bs">${bs.map(([b, hit]) => `<span class="${hit ? "hit" : ""}">${b}</span>`).join("")}</div></div>`;
  const meaning = (t) => (t ? `<span class="muted" style="font-size:14px"> ${t}</span>` : "");
  h(`<div class="frame">
    <div class="card">
      <div class="kicker">${c.reply}</div>
      <div class="reply zh"><mark>誓言</mark>、实验、试验、饰演、食盐</div>
    </div>
    <div class="card">
      <div class="kicker"><span>${c.split.replace(/(\[\^.*?\]\+)/, '<span class="mono" style="color:var(--ink)">$1</span>')}</span></div>
      <div class="bytes" style="align-items:flex-start">
        ${ch("誓", [["e8"], ["aa"], ["93"]])}
        ${ch("言", [["e8"], ["a8"], ["80", true]])}
        ${ch("、", [["e3"], ["80", true], ["81"]], "sep")}
        <div class="arrow">…</div>
        <div style="align-self:center;max-width:300px;font-size:14px;color:var(--bad);font-weight:500">${c.hit}</div>
      </div>
      <div class="mono muted" style="font-size:13px;margin-top:14px">${c.sepNote}</div>
    </div>
    <div class="card">
      <div class="kicker">${c.word}</div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
        ${ch("誓", [["e8"], ["aa"], ["93"]])}
        <div class="arrow">+</div>
        <div class="ch" style="border-color:var(--bad)"><div class="g" style="color:var(--bad)">�</div><div class="bs"><span>e8</span><span>a8</span></div></div>
      </div>
      <div style="font-size:15px;margin-bottom:16px">${c.wordNote}</div>
      <div class="outcome">
        <div class="o">${c.intended}<div class="zh">誓言${meaning(c.vow)}</div></div>
        <div class="o" style="color:var(--bad)">${c.shown}<div class="zh">实验${meaning(c.experiment)}</div></div>
      </div>
    </div>
  </div>`);
}

({ "context-ablation": contextAblation, "name-swap": nameSwap, phonetic, clock, bytes })[FIG]();
document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
