# Arion's offline Simplified Chinese full-Pinyin profile.
# Adapts the Apache-2.0 pinyin_simp schema identified in keyboard-runtime.json.
# Stroke reverse lookup is outside this keyboard profile's asset closure.
schema:
  schema_id: arion_pinyin
  name: Arion Pinyin
  version: '1'

__include: pinyin_simp.schema:/
__patch:
  engine/translators:
    - punct_translator
    - arion_bilingual
  engine/filters:
    - arion_emoji
  menu/page_size: 9
  translator/user_dict: arion_pinyin
  translator/db_class: arion_encrypted_userdb
  translator/enable_user_dict: true
  translator/enable_correction: true
  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  recognizer/patterns/uppercase: ''
  reverse_lookup: null
  recognizer/patterns/reverse_lookup: null
  recognizer/patterns/punct: null
  # Ordinary punctuation commits directly, never opens a symbol menu.
  punctuator:
    half_shape: &punctuation
      ',': { commit: ， }
      '.': { commit: 。 }
      '<': { commit: 《 }
      '>': { commit: 》 }
      '/': { commit: 、 }
      '?': { commit: ？ }
      ';': { commit: ； }
      ':': { commit: ： }
      "'": { pair: [ '‘', '’' ] }
      '"': { pair: [ '“', '”' ] }
      '\': { commit: 、 }
      '|': { commit: '|' }
      '`': { commit: '`' }
      '~': { commit: ～ }
      '!': { commit: ！ }
      '@': { commit: '@' }
      '#': { commit: '#' }
      '%': { commit: '%' }
      '$': { commit: ￥ }
      '^': { commit: …… }
      '&': { commit: '&' }
      '*': { commit: '*' }
      '(': { commit: （ }
      ')': { commit: ） }
      '-': { commit: '-' }
      '_': { commit: —— }
      '+': { commit: '+' }
      '=': { commit: '=' }
      '[': { commit: 【 }
      ']': { commit: 】 }
      '{': { commit: ｛ }
      '}': { commit: ｝ }
    full_shape: *punctuation
  key_binder/import_preset: null
  key_binder/bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
